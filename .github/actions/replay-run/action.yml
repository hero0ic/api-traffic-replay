name: API Traffic Replay
description: >
  Install the replay engine, run recorded requests against a target, fail on
  regressions, and optionally upload the report with a project API token.
inputs:
  target:
    description: Base URL of the candidate API (replay --target).
    required: true
  requests:
    description: Path to the request JSON file.
    required: true
  baseline:
    description: Path to the baseline JSON file from replay record.
    required: true
  report:
    description: Where to write the regression report JSON.
    required: false
    default: report.json
  concurrency:
    description: Maximum in-flight requests.
    required: false
    default: "10"
  timeout:
    description: Per-request timeout in seconds.
    required: false
    default: "10"
  unsafe:
    description: Allow POST/PUT/PATCH/DELETE (true/false).
    required: false
    default: "false"
  python-version:
    description: Python version used to install the engine.
    required: false
    default: "3.12"
  working-directory:
    description: Directory that contains pyproject.toml / the request files.
    required: false
    default: "."
  upload:
    description: Upload the report to the hosted API after the run (true/false).
    required: false
    default: "false"
  api-url:
    description: Hosted API base URL (required when upload=true).
    required: false
    default: ""
  project-id:
    description: Project UUID (required when upload=true).
    required: false
    default: ""
  api-token:
    description: Project API token. Prefer a GitHub secret.
    required: false
    default: ""
outputs:
  report-path:
    description: Path to the written report JSON.
    value: ${{ steps.replay.outputs.report-path }}
  exit-code:
    description: Exit code from replay run (0 match, 1 regression/error).
    value: ${{ steps.replay.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install replay engine
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip install --upgrade pip && python -m pip install .

    - name: Replay against target
      id: replay
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPLAY_TARGET: ${{ inputs.target }}
        REPLAY_REQUESTS: ${{ inputs.requests }}
        REPLAY_BASELINE: ${{ inputs.baseline }}
        REPLAY_REPORT: ${{ inputs.report }}
        REPLAY_CONCURRENCY: ${{ inputs.concurrency }}
        REPLAY_TIMEOUT: ${{ inputs.timeout }}
        REPLAY_UNSAFE: ${{ inputs.unsafe }}
      run: |
        set +e
        ARGS=(
          replay run
          --target "$REPLAY_TARGET"
          --requests "$REPLAY_REQUESTS"
          --baseline "$REPLAY_BASELINE"
          --out "$REPLAY_REPORT"
          --concurrency "$REPLAY_CONCURRENCY"
          --timeout "$REPLAY_TIMEOUT"
          --format text
        )
        if [[ "$REPLAY_UNSAFE" == "true" ]]; then
          ARGS+=(--unsafe)
        fi
        "${ARGS[@]}"
        code=$?
        echo "exit-code=${code}" >> "$GITHUB_OUTPUT"
        echo "report-path=${REPLAY_REPORT}" >> "$GITHUB_OUTPUT"
        exit "${code}"

    - name: Upload report with API token
      if: ${{ always() && inputs.upload == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPLAY_API_URL: ${{ inputs.api-url }}
        REPLAY_PROJECT_ID: ${{ inputs.project-id }}
        REPLAY_API_TOKEN: ${{ inputs.api-token }}
        REPLAY_REPORT: ${{ inputs.report }}
        REPLAY_REQUESTS: ${{ inputs.requests }}
        REPLAY_BASELINE: ${{ inputs.baseline }}
        REPLAY_TARGET: ${{ inputs.target }}
      run: |
        if [[ -z "$REPLAY_API_URL" || -z "$REPLAY_PROJECT_ID" || -z "$REPLAY_API_TOKEN" ]]; then
          echo "upload=true requires api-url, project-id, and api-token" >&2
          exit 2
        fi
        if [[ ! -f "$REPLAY_REPORT" ]]; then
          echo "report file missing: $REPLAY_REPORT" >&2
          exit 2
        fi
        replay upload \
          --api-url "$REPLAY_API_URL" \
          --token "$REPLAY_API_TOKEN" \
          --project-id "$REPLAY_PROJECT_ID" \
          --report "$REPLAY_REPORT" \
          --requests "$REPLAY_REQUESTS" \
          --baseline "$REPLAY_BASELINE" \
          --target "$REPLAY_TARGET"
