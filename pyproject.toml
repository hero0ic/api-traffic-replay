[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-traffic-replay"
version = "0.1.0"
description = "Record HTTP requests, replay them, and report API regressions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0",
]
dev = [
    "api-traffic-replay[server]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
replay = "replay_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_core", "src/replay_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
